<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Timesheet Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header"><h1>⏱️ TIMESHEET PRO</h1><p>Work Hours & Payroll</p></div>

<!-- LOGIN -->
<div id="page-login">
  <div id="err" class="hidden alert-error"></div>
  <label>Username</label>
  <input type="text" id="username-input" placeholder="your username" autocomplete="username">
  <label>Password</label>
  <input type="password" id="password-input" placeholder="••••••••" autocomplete="current-password">
  <button class="btn-primary" onclick="login()">Login</button>
</div>

<!-- TRACKER -->
<div id="page-tracker" class="hidden">
  <div class="t-header">
    <div class="t-name" id="t-name"></div>
    <div class="t-week" id="t-week"></div>
  </div>
  <div class="week-nav">
    <button onclick="prevWeek()">&#8249;</button>
    <span id="nav-label"></span>
    <button onclick="nextWeek()">&#8250;</button>
  </div>
  <table class="ts-table">
    <thead>
      <tr>
        <th>Day</th>
        <th style="text-align:center">In</th>
        <th style="text-align:center">Out</th>
        <th style="text-align:center">Lunch</th>
        <th style="text-align:right">Hrs</th>
        <th style="text-align:right">Pay</th>
        <!-- job rows are full-width sub-rows, no header needed -->
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
    <tfoot>
      <tr class="totals-row">
        <td colspan="4">TOTAL</td>
        <td class="col-hrs" id="tot-hrs">0.0h</td>
        <td class="col-pay" id="tot-gross">$0.00</td>
      </tr>
    </tfoot>
  </table>

  <div class="materials-section">
    <h3>&#128230; Materials This Week</h3>
    <div id="materials-list"></div>
  </div>

  <div class="payslip">
    <h3>&#128196; Weekly Payslip</h3>
    <div class="ps-row"><span class="ps-lbl">Hourly Rate</span><span class="ps-val" id="ps-rate">$0.00/h</span></div>
    <div class="ps-row"><span class="ps-lbl">Total Hours</span><span class="ps-val" id="ps-hrs">0.0 hrs</span></div>
    <div class="ps-row"><span class="ps-lbl">Gross Pay</span><span class="ps-val green" id="ps-gross">$0.00</span></div>
    <div class="ps-net"><div class="lbl">Total Hours × Rate</div><div class="amt" id="ps-net">$0.00</div></div>
  </div>

  <div class="notes-section">
    <h3>📝 Shared Notes (All Workers)</h3>
    <div id="shared-notes" style="background:#f5f5f5;padding:12px;border-radius:4px;margin-bottom:12px;min-height:60px;font-size:13px;color:#555"></div>
    <label>Add Notes</label>
    <textarea id="materials-input" rows="3" placeholder="Concrete, nails, tools..."></textarea>
    <button class="btn-primary" onclick="saveNotes()">SAVE NOTES</button>
  </div>
  <div class="spacer"></div>
</div>

<!-- TIME MODAL -->
<div id="time-modal" class="modal-overlay hidden" onclick="overlayTap(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title">Set Time</div>
    <div class="modal-sub" id="modal-sub"></div>
    <input type="time" id="time-input" class="time-input">
    <div class="modal-btns">
      <button class="btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn-primary"   style="flex:2" onclick="confirmTime()">Set &#10003;</button>
    </div>
  </div>
</div>

<!-- LUNCH MODAL -->
<div id="lunch-modal" class="modal-overlay hidden" onclick="lunchOverlayTap(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="lunch-modal-title">Set Lunch Break</div>
    <div class="modal-sub" id="lunch-modal-sub"></div>
    <div class="lunch-options">
      <button class="lunch-btn" onclick="setLunch(0)">None</button>
      <button class="lunch-btn" onclick="setLunch(30)">30 min</button>
      <button class="lunch-btn" onclick="setLunch(45)">45 min</button>
      <button class="lunch-btn" onclick="setLunch(60)">60 min</button>
    </div>
    <div class="modal-btns" style="margin-top:10px">
      <button class="btn-secondary" style="flex:1" onclick="closeLunchModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" class="hidden"></div>
<div id="action-bar" class="action-bar hidden">
  <button class="btn-secondary" onclick="showSettings()">⚙️ Settings</button>
  <button class="btn-secondary" onclick="logout()">&#8592; Logout</button>
</div>

<!-- SETTINGS MODAL -->
<div id="settings-modal" class="modal-overlay hidden" onclick="settingsOverlayTap(event)">
  <div class="modal-box" onclick="event.stopPropagation()" style="max-width:400px;max-height:90vh;overflow-y:auto">
    <div class="modal-title">Settings</div>
    <div id="settings-err" class="hidden alert-error" style="margin:12px 0;font-size:13px"></div>
    
    <div style="padding:12px;">
      <label style="display:block;margin-top:16px;font-weight:600;font-size:13px">Change Password</label>
      <input type="password" id="current-password" placeholder="Current password" style="width:100%;padding:8px;margin-top:6px;border:1px solid #ddd;border-radius:4px;font-size:14px" autocomplete="current-password">
      <input type="password" id="new-password" placeholder="New password (min 8 chars)" style="width:100%;padding:8px;margin-top:8px;border:1px solid #ddd;border-radius:4px;font-size:14px" autocomplete="new-password">
      <input type="password" id="confirm-password" placeholder="Confirm new password" style="width:100%;padding:8px;margin-top:8px;border:1px solid #ddd;border-radius:4px;font-size:14px" autocomplete="new-password">
      <button class="btn-primary" style="width:100%;margin-top:12px" onclick="changePassword()">Update Password</button>
    </div>
    
    <div class="modal-btns" style="margin-top:16px">
      <button class="btn-secondary" style="flex:1" onclick="closeSettings()">Close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
